[package]
name = "autumn-plugin-aws-lambda"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "Run an autumn-web application on AWS Lambda"
repository = "https://github.com/autumn-foundation/autumn-plugin-aws-lambda"
readme = "README.md"
keywords = ["autumn", "aws", "lambda", "serverless", "plugin"]
categories = ["web-programming::http-server"]
exclude = ["verification/", ".github/", ".githooks/", "CLAUDE.md", ".gitignore"]

[dependencies]
autumn-web = { version = "0.8", default-features = false }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
lambda_http = { version = "1.3", features = ["concurrency-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
futures-core = "0.3"
futures-util = "0.3"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Conflicts with rustc `unreachable_pub`, which this crate uses instead.
redundant_pub_crate = "allow"
