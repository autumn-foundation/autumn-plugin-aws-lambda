name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test and coverage (minimum 85% lines)
        run: cargo llvm-cov --fail-under-lines 85 --summary-only

  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Verus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo verus-lang/verus --pattern '*x86-linux.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/*x86-linux.zip -d "$RUNNER_TEMP/verus"
          VERUS="$(find "$RUNNER_TEMP/verus" -type f -name verus -perm -u+x | head -n1)"
          echo "VERUS=$VERUS" >> "$GITHUB_ENV"
      - name: Install the Verus toolchain
        run: |
          out="$("$VERUS" --version 2>&1 || true)"
          toolchain="$(echo "$out" | grep -oP 'rustup install \K\S+' | head -n1 || true)"
          if [ -n "$toolchain" ]; then rustup install "$toolchain"; fi
          "$VERUS" --version
      - name: Verify
        run: verification/verify.sh
